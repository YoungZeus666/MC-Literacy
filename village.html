<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的世界之认字大冒险</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei","PingFang SC",sans-serif;}
body{
  min-height:100vh;
  padding:12px;
  color:#fff;
}
body.theme-grass{
  background:#5b9a3d;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%235b9a3d'/%3E%3Crect y='60' width='80' height='20' fill='%23845f3a'/%3E%3C/svg%3E");
}
body.theme-iron{
  background:#5c6570;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%235c6570'/%3E%3Crect y='60' width='80' height='20' fill='%233a4048'/%3E%3Crect x='18' y='22' width='14' height='14' fill='%23c4b59a'/%3E%3Crect x='48' y='8' width='12' height='12' fill='%239aa3ad'/%3E%3C/svg%3E");
}
body.theme-zombie{
  background:#243018;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%23243018'/%3E%3Crect y='60' width='80' height='20' fill='%23151c0e'/%3E%3Crect x='10' y='18' width='16' height='16' fill='%234a5c28'/%3E%3Crect x='50' y='30' width='12' height='12' fill='%233a4a20'/%3E%3C/svg%3E");
}
body.theme-stone{
  background:#6b6b6b;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%236b6b6b'/%3E%3Crect y='60' width='80' height='20' fill='%234a4a4a'/%3E%3Crect x='12' y='15' width='16' height='16' fill='%23999999'/%3E%3Crect x='50' y='22' width='14' height='14' fill='%23888888'/%3E%3C/svg%3E");
}
body.theme-sand{
  background:#d4b86a;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%23d4b86a'/%3E%3Crect y='60' width='80' height='20' fill='%23b8a050'/%3E%3Crect x='20' y='10' width='12' height='12' fill='%23e8d48a'/%3E%3Crect x='55' y='18' width='10' height='10' fill='%23e0c878'/%3E%3C/svg%3E");
}
body.theme-emerald{
  background:#2d7d46;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%232d7d46'/%3E%3Crect y='60' width='80' height='20' fill='%231a5a30'/%3E%3Crect x='15' y='12' width='14' height='14' fill='%2355ddaa'/%3E%3Crect x='48' y='22' width='12' height='12' fill='%2344cc99'/%3E%3C/svg%3E");
}
body.theme-redstone{
  background:#6b2020;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%236b2020'/%3E%3Crect y='60' width='80' height='20' fill='%234a1010'/%3E%3Crect x='18' y='14' width='12' height='12' fill='%23ff4444'/%3E%3Crect x='50' y='24' width='10' height='10' fill='%23cc2222'/%3E%3C/svg%3E");
}
body.theme-diamond{
  background:#2a6b8a;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%232a6b8a'/%3E%3Crect y='60' width='80' height='20' fill='%231a4a60'/%3E%3Crect x='16' y='12' width='14' height='14' fill='%2388ddff'/%3E%3Crect x='50' y='22' width='12' height='12' fill='%2366ccff'/%3E%3C/svg%3E");
}
body.theme-obsidian{
  background:#1a0a2e;
  background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='%231a0a2e'/%3E%3Crect y='60' width='80' height='20' fill='%23100820'/%3E%3Crect x='15' y='12' width='14' height='14' fill='%235a2aaa'/%3E%3Crect x='48' y='22' width='12' height='12' fill='%234a1a88'/%3E%3C/svg%3E");
}
.container{
  max-width:480px;
  margin:0 auto;
  background:linear-gradient(180deg,#3d3d3d,#2c2c2c);
  border:6px solid #222;
  border-radius:14px;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.title{
  text-align:center;
  font-size:22px;
  margin-bottom:4px;
  color:#55ff55;
  font-weight:bold;
  text-shadow:2px 2px 0 #1a6b1a;
}
.subtitle{
  text-align:center;
  font-size:13px;
  color:#aaa;
  margin-bottom:10px;
}
.info-bar{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px 8px;
  background:#222;
  padding:8px 10px;
  border-radius:8px;
  margin-bottom:10px;
  font-size:12px;
  border:2px solid #111;
}
.info-bar > div{white-space:nowrap;}
.stage-box{
  text-align:center;
  margin-bottom:8px;
}
.stage-title{
  font-size:17px;
  color:#88ddff;
  font-weight:bold;
}
.stage-title.is-review{color:#ffe082;}
.stage-icon{
  font-size:13px;
  color:#bbb;
  margin-top:4px;
}
.block-area{
  position:relative;
  text-align:center;
  margin-bottom:8px;
}
.block-wrap{
  width:180px;
  height:180px;
  margin:0 auto;
  position:relative;
}
.block-card{
  width:100%;
  height:100%;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:76px;
  font-weight:bold;
  user-select:none;
  border:10px solid;
}
.block-grass{
  background-color:#76c953;
  background-image:linear-gradient(135deg,#84d85f,#5da83f);
  border-color:#4c8a33;
  color:#1c3d10;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.15), 0 6px 0 #3c6d29;
}
.block-iron{
  background-color:#8e959c;
  background-image:linear-gradient(135deg,#d5d8dc,#6f767e);
  border-color:#4a5058;
  color:#1c1f24;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.22), 0 6px 0 #32363c;
}
.block-zombie{
  background-color:#4a5c28;
  background-image:linear-gradient(135deg,#6b7f3a,#2c3618);
  border-color:#1a2010;
  color:#d7ef8a;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.08), 0 6px 0 #12160c;
}
.block-stone{
  background-color:#888;
  background-image:linear-gradient(135deg,#aaa,#707070);
  border-color:#505050;
  color:#1a1a1a;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.12), 0 6px 0 #505050;
}
.block-sand{
  background-color:#e8d48a;
  background-image:linear-gradient(135deg,#f5e8b0,#d4b860);
  border-color:#b8a050;
  color:#4a3a10;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.2), 0 6px 0 #a09040;
}
.block-emerald{
  background-color:#44cc88;
  background-image:linear-gradient(135deg,#66eeaa,#2aaa66);
  border-color:#1a7040;
  color:#0a3018;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.25), 0 6px 0 #1a6030;
}
.block-redstone{
  background-color:#cc3333;
  background-image:linear-gradient(135deg,#ee5555,#aa2222);
  border-color:#701010;
  color:#fff0e0;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.2), 0 6px 0 #601010;
}
.block-diamond{
  background-color:#44bbdd;
  background-image:linear-gradient(135deg,#88eeff,#2299bb);
  border-color:#106080;
  color:#0a3040;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.3), 0 6px 0 #105060;
}
.block-obsidian{
  background-color:#2a1050;
  background-image:linear-gradient(135deg,#4a2088,#1a0830);
  border-color:#0a0418;
  color:#c8a8ff;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.08), 0 6px 0 #0a0418;
}
.block-stage{
  position:relative;
  width:268px;
  height:180px;
  margin:0 auto;
}
.pinyin-row{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.pinyin-text{
  font-size:24px;
  color:#ffe082;
  font-weight:bold;
  letter-spacing:1px;
  min-width:3em;
}
.word-hint{
  display:block;
  text-align:center;
  margin-top:6px;
  font-size:16px;
  color:#ffe082;
  font-weight:bold;
  min-height:22px;
}
.word-hint.is-hidden{color:#888;}
.pinyin-text.is-hidden{color:#888;}
.btn-speak,.btn-pinyin{
  padding:8px 12px;
  font-size:15px;
  border:none;
  border-radius:8px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.3);
}
.btn-speak{background:linear-gradient(180deg,#5c6bc0,#3949ab);}
.btn-pinyin{background:linear-gradient(180deg,#f0a020,#c47a00);}
.btn-speak:active,.btn-pinyin:active{transform:translateY(2px);box-shadow:none;}
.particle-container{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  overflow:visible;
}
.particle{
  position:absolute;
  width:14px;height:14px;
}
.particle-grass{background:#75c953;border:1px solid #4c8a33;}
.particle-iron{background:#c5c9ce;border:1px solid #555;}
.particle-zombie{background:#6b8f3a;border:1px solid #2a3518;}
.particle-stone{background:#aaa;border:1px solid #666;}
.particle-sand{background:#f0d888;border:1px solid #b8a050;}
.particle-emerald{background:#55ddaa;border:1px solid #1a7040;}
.particle-redstone{background:#ee5555;border:1px solid #701010;}
.particle-diamond{background:#88eeff;border:1px solid #106080;}
.particle-obsidian{background:#6a30cc;border:1px solid #0a0418;}
.zombie{
  text-align:center;
  margin-bottom:4px;
  font-size:14px;
  color:#ff8080;
  min-height:20px;
}
/* 边缘红光闪烁（答错/僵尸靠近时） */
.danger-flash{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  pointer-events:none;
  z-index:50;
  box-shadow:inset 0 0 80px 20px rgba(255,0,0,.35);
  opacity:0;
  transition:opacity .15s;
}
.danger-flash.on{
  opacity:1;
  animation:danger-pulse .4s ease-out;
}
@keyframes danger-pulse{
  0%{opacity:1;}
  100%{opacity:0;}
}
/* 僵尸波次进度条 */
.wave-bar-wrap{
  background:#222;
  border-radius:6px;
  height:18px;
  margin:0 0 8px;
  overflow:hidden;
  border:2px solid #111;
  position:relative;
}
.wave-bar-fill{
  height:100%;
  background:linear-gradient(90deg,#ff4444,#ff2222,#cc0000);
  transition:width .35s;
  border-radius:4px;
}
.wave-bar-label{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
  color:#fff;
  text-shadow:0 0 4px rgba(0,0,0,.8);
}
/* 炮塔区域 */
.turret-section{
  background:#222;
  border-radius:8px;
  padding:6px 8px;
  margin:4px 0 8px;
  border:2px solid #111;
  display:none;
}
.turret-section.on{display:block;}
.turret-title{
  text-align:center;
  color:#ffdd55;
  font-size:12px;
  margin-bottom:4px;
}
.turret-row{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
}
.turret-icon{
  width:24px;height:24px;
  background:#777;
  border:2px solid #555;
  border-radius:3px;
  position:relative;
  transition:background .3s;
}
.turret-icon.built{
  background:#5a8a3a;
  border-color:#3a5a2a;
}
.turret-icon.built::after{
  content:"";
  position:absolute;
  top:3px;left:3px;
  width:6px;height:6px;
  background:#ff4444;
  border-radius:50%;
  box-shadow:0 0 3px #ff4444;
}
.turret-empty{
  width:24px;height:24px;
  background:#333;
  border:2px dashed #555;
  border-radius:3px;
  opacity:.5;
}
.btn-turret{
  padding:4px 10px;
  font-size:12px;
  border:none;
  border-radius:6px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(180deg,#e67e22,#b85c0c);
  box-shadow:0 3px 0 rgba(0,0,0,.3);
}
.btn-turret:active{transform:translateY(2px);box-shadow:none;}
.btn-turret:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.tip-text{
  text-align:center;
  font-size:15px;
  min-height:40px;
  color:#ffdd55;
  margin-bottom:8px;
  line-height:1.45;
}

/* ===== 村庄建造：三关共用一块画布，按关扩建 ===== */
.house-section{
  background:#222;
  border-radius:10px;
  padding:8px 8px 6px;
  margin:4px 0 10px;
  border:2px solid #111;
}
.house-title{
  text-align:center;
  color:#ffdd55;
  font-size:13px;
  margin-bottom:6px;
  font-weight:bold;
}
.village-canvas{
  position:relative;
  width:300px;
  height:230px;
  margin:0 auto;
}
.flag-pole{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:4px;
  height:28px;
  background:#6b4423;
  opacity:0;
  z-index:5;
  transition:opacity .3s;
}
.flag-pole.on{opacity:1;}
.flag-fill{
  position:absolute;
  top:4px;
  left:calc(50% + 3px);
  width:28px;
  height:16px;
  background:#e74c3c;
  clip-path:inset(0 100% 0 0);
  transition:clip-path .4s;
  z-index:5;
}
.house-roof{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:96px solid transparent;
  border-right:96px solid transparent;
  border-bottom:52px solid #444;
}
.house-roof-fill{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:96px solid transparent;
  border-right:96px solid transparent;
  border-bottom:52px solid #c0392b;
  clip-path:inset(0 0 100% 0);
  transition:clip-path .4s;
}
.house-wall{
  position:absolute;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  width:210px;
  height:92px;
  background:#444;
  border:3px solid #333;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:3px;
  padding:4px;
  z-index:1;
}
.wall-cell{
  background:#555;
  border-radius:1px;
  transition:background .3s;
}
.wall-cell.done{
  background:#d48b47;
  background-image:linear-gradient(135deg,#e09a55,#c07a3a);
}
.house-door{
  position:absolute;
  top:122px;
  left:50%;
  transform:translateX(-50%);
  width:34px;
  height:44px;
  background:#6b4423;
  border:2px solid #4a2f17;
  border-radius:4px 4px 0 0;
  z-index:2;
}
.house-door::after{
  content:"";
  position:absolute;
  right:5px;
  top:50%;
  width:6px;height:6px;
  background:#ffd700;
  border-radius:50%;
}
.torch-col{
  position:absolute;
  top:80px;
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:3;
}
.torch-col.left{left:14px;}
.torch-col.right{right:14px;}
.torch{
  width:12px;
  height:24px;
  background:#3a2a18;
  border-radius:1px;
  opacity:.15;
  position:relative;
  transition:opacity .3s;
}
.torch.on{
  opacity:1;
  background:#6b4423;
}
.torch.on::after{
  content:"";
  position:absolute;
  top:-10px;
  left:2px;
  width:8px;
  height:11px;
  background:#ff9800;
  border-radius:50% 50% 40% 40%;
  box-shadow:0 0 8px #ff9800;
}
.path-row{
  position:absolute;
  top:168px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:4px;
  z-index:2;
}
.path-stone{
  width:18px;
  height:12px;
  background:#3a3a3a;
  border-radius:2px;
  opacity:.15;
  transition:opacity .3s, background .3s;
}
.path-stone.on{
  opacity:1;
  background:#c4a574;
}
.fence-row{
  position:absolute;
  bottom:6px;
  left:8px;
  right:8px;
  height:28px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  z-index:3;
}
.fence-post{
  width:11px;
  height:26px;
  background:#3a2a18;
  border-radius:2px 2px 0 0;
  opacity:.15;
  transition:opacity .3s, background .3s;
}
.fence-post.on{
  opacity:1;
  background:#8d6e63;
  box-shadow:1px 0 0 #5d4037;
}
.flower-row{
  position:absolute;
  bottom:34px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:4;
}
.flower{
  font-size:18px;
  line-height:1;
  opacity:.12;
  transition:opacity .3s, transform .3s;
}
.flower.on{opacity:1;transform:scale(1.08);}
/* 铁栅栏（第4关） */
.iron-bars{
  position:absolute;
  top:76px;left:50%;
  transform:translateX(-50%);
  width:220px;height:86px;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:2px;
  padding:2px 4px;
  pointer-events:none;
  z-index:5;
}
.iron-bar{
  width:100%;height:100%;
  background:#aaa;
  border:1px solid #666;
  border-radius:1px;
  opacity:.12;
  transition:opacity .3s, background .3s;
}
.iron-bar.on{opacity:1;background:#c4c9ce;box-shadow:0 0 2px rgba(200,200,200,.5);}
/* 绿宝石（第5关） */
.emerald-gems{
  position:absolute;
  top:18px;left:50%;
  transform:translateX(-50%);
  width:220px;height:60px;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:2px;
  padding:2px 4px;
  pointer-events:none;
  z-index:6;
}
.emerald-gem{
  width:100%;height:100%;
  background:#2a8a4a;
  border:2px solid #1a5a2a;
  border-radius:2px;
  opacity:.12;
  transition:opacity .3s, transform .3s;
}
.emerald-gem.on{opacity:1;transform:scale(1.15);box-shadow:0 0 6px rgba(80,220,120,.6);}
/* 红石灯（第6关） */
.redstone-lamps{
  position:absolute;
  top:80px;left:50%;
  transform:translateX(-50%);
  width:220px;height:80px;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;
  padding:4px;
  pointer-events:none;
  z-index:5;
}
.redstone-lamp{
  width:100%;height:100%;
  background:#661111;
  border:1px solid #440000;
  border-radius:50%;
  opacity:.12;
  transition:opacity .3s, box-shadow .3s;
}
.redstone-lamp.on{opacity:1;background:#cc2222;box-shadow:0 0 8px rgba(255,60,60,.8);}
/* 钻石块（第7关） */
.diamond-blocks{
  position:absolute;
  top:74px;left:50%;
  transform:translateX(-50%);
  width:230px;height:88px;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:2px;
  padding:2px 4px;
  pointer-events:none;
  z-index:2;
}
.diamond-block{
  width:100%;height:100%;
  background:#2a8aaa;
  border:2px solid #105060;
  border-radius:2px;
  opacity:.12;
  transition:opacity .3s, box-shadow .3s;
}
.diamond-block.on{opacity:.65;box-shadow:0 0 6px rgba(100,220,255,.7);}

  z-index:1;

.sand-tile{

.palm-tree.right{right:0;}

// ====== 音效（Web Audio生成，无需外部文件）======
let audioCtx;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playDigSound(){
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.value = 420;
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime+0.18);
}
function playGemSound(){
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(660, audioCtx.currentTime);
  osc.frequency.setValueAtTime(880, audioCtx.currentTime+0.08);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime+0.25);
}
function playWrongSound(){
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.value = 200;
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime+0.25);
}
function playWinSound(){
  initAudio();
  [523,659,784,1047].forEach((freq,i)=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    const t = audioCtx.currentTime + i*0.12;
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.3);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(t);osc.stop(t+0.3);
  });
}

let zhVoice = null;
function loadVoices(){
  if(!window.speechSynthesis) return;
  const voices = speechSynthesis.getVoices() || [];
  if(!voices.length) return;
  const notCantonese = v => !/粤|粵|hk|yue/i.test(String(v.name || "") + String(v.lang || ""));
  const notTw = v => !/台湾|台灣|tw-|_TW|TW"/i.test(String(v.name || "") + String(v.lang || ""));
  // 精确匹配普通话声音：优先 Google 普通话（Chrome 里最稳），其次系统婷婷，再回退到中国大陆普通话
  zhVoice =
    voices.find(v => /普通话/.test(v.name) && notCantonese(v))
    || voices.find(v => /婷婷|ting/i.test(v.name) && notCantonese(v))
    || voices.find(v => /^(zh|cmn)-?(CN|cn)/i.test(v.lang) && notCantonese(v) && notTw(v))
    || null;
  console.log("选中声音：", zhVoice ? (zhVoice.name + " | " + zhVoice.lang) : "未找到普通话声音");
}
function speakCurrent(){
  const ch = currentChar();
  if(!ch || !window.speechSynthesis) return;
  if(!zhVoice) loadVoices();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(ch);
  u.lang = "zh-CN";
  u.rate = 0.75;
  if(zhVoice) u.voice = zhVoice;
  console.log("朗读用声：", zhVoice ? (zhVoice.name + " | " + zhVoice.lang) : "浏览器默认");
  setTimeout(function(){ speechSynthesis.speak(u); }, 60);
}
function revealPinyin(){
  pinyinRevealed = true;
  const ch = currentChar();
  dom.pinyinText.innerText = PINYIN[ch] || "";
  dom.pinyinText.classList.remove("is-hidden");
  dom.wordHint.innerText = "组词：" + (COMPOUND[ch] || "");
  dom.wordHint.classList.remove("is-hidden");
}
function speakAndReveal(){
  revealPinyin();
  speakCurrent();
}

const STORAGE_KEY = "mc_read_game_v2";
function saveState(){
  const state = {
    gem:gem,
    currentLevel:currentLevel,
    index:index,
    missed:missed,
    inReview:inReview,
    reviewList:reviewList,
    reviewIndex:reviewIndex,
    resumeIndex:resumeIndex,
    pendingLevelUp:pendingLevelUp,
    build:build,
    zombieWave:zombieWave,
    turretCount:turretCount,
    zombieSlots:zombieSlots
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(typeof s.gem === "number") gem = s.gem;
      if(typeof s.currentLevel === "number" && s.currentLevel < levels.length) currentLevel = s.currentLevel;
      if(typeof s.index === "number") index = s.index;
      if(Array.isArray(s.missed)) missed = s.missed.filter(function(ch){ return typeof ch === "string" && ch.length === 1; });
      if(Array.isArray(s.reviewList)) reviewList = s.reviewList.filter(function(ch){ return typeof ch === "string" && ch.length === 1; });
      if(typeof s.reviewIndex === "number") reviewIndex = s.reviewIndex;
      if(typeof s.resumeIndex === "number") resumeIndex = s.resumeIndex;
      if(typeof s.pendingLevelUp === "boolean") pendingLevelUp = s.pendingLevelUp;
      if(typeof s.zombieWave === "number") zombieWave = s.zombieWave;
      if(typeof s.turretCount === "number") turretCount = s.turretCount;
      if(Array.isArray(s.zombieSlots)){
        zombieSlots = s.zombieSlots.filter(function(v){ return typeof v === "number" && v >= 0 && v < 24; });
      }else if(typeof s.zombieCount === "number" && s.zombieCount > 0){
        // 旧存档：没有位置信息，僵尸都视为贴在房子跟前
        zombieSlots = [];
        for(let st=5; st>=0 && zombieSlots.length < s.zombieCount; st--){
          for(let ln=0; ln<4 && zombieSlots.length < s.zombieCount; ln++){
            zombieSlots.push(ln*6 + st);
          }
        }
      }
      loadBuild(s);
      if(s.inReview && reviewList.length){
        inReview = true;
        if(reviewIndex >= reviewList.length) reviewIndex = 0;
      }else{
        inReview = false;
        pendingLevelUp = false;
      }
    }
  }catch(e){}
}

function fillKids(el, count, className, labels){
  el.innerHTML = "";
  for(let i=0;i<count;i++){
    const div = document.createElement("div");
    div.className = className;
    if(labels) div.innerText = labels[i];
    el.appendChild(div);
  }
}
function toggleOn(nodes, filled){
  for(let i=0;i<nodes.length;i++){
    if(i < filled) nodes[i].classList.add("on");
    else nodes[i].classList.remove("on");
  }
}
function loadBuild(s){
  if(Array.isArray(s.build) && s.build.length >= 8){
    build = [0,1,2,3,4,5,6,7].map(function(i){
      const n = s.build[i];
      if(typeof n !== "number" || n < 0) return 0;
      return Math.min(Math.floor(n), chapterMax(i));
    });
    return;
  }
  let rest = typeof s.gem === "number" ? s.gem : 0;
  build = [0,0,0,0,0,0,0,0];
  const unlocked = Math.min(currentLevel, 7);
  for(let i=0;i<=unlocked;i++){
    build[i] = Math.min(Math.max(0, rest), chapterMax(i));
    rest -= build[i];
  }
}
function addBuild(){
  const cap = chapterMax(currentLevel);
  if(build[currentLevel] < cap) build[currentLevel] += 1;
}

function renderVillage(){
  // 第1关：小屋墙壁+屋顶
  const hutMax = chapterMax(0);
  const hut = Math.min(build[0], hutMax);
  const wallFilled = Math.min(hut, HUT_WALL);
  const roofMax = Math.max(1, hutMax - HUT_WALL);
  const roofFilled = Math.max(0, hut - HUT_WALL);
  const cells = dom.houseWall.querySelectorAll(".wall-cell");
  for(let i=0;i<cells.length;i++){
    if(i < wallFilled) cells[i].classList.add("done");
    else cells[i].classList.remove("done");
  }
  dom.roofFill.style.clipPath = "inset(" + ((1 - Math.min(roofFilled / roofMax, 1)) * 100) + "% 0 0 0)";

  // 第2关：石子路+栅栏+花
  const yardMax = chapterMax(1);
  const yard = Math.min(build[1], yardMax);
  const pathFilled = Math.min(yard, YARD_PATH);
  const fenceFilled = Math.min(Math.max(0, yard - YARD_PATH), YARD_FENCE);
  const flowerFilled = Math.min(Math.max(0, yard - YARD_PATH - YARD_FENCE), YARD_FLOWER);
  toggleOn(dom.pathRow.querySelectorAll(".path-stone"), pathFilled);
  toggleOn(dom.fenceRow.querySelectorAll(".fence-post"), fenceFilled);
  toggleOn(dom.flowerRow.querySelectorAll(".flower"), flowerFilled);

  // 第3关：沙地庭院（沙地砖→仙人掌→水井→棕榈→沙滩装饰）
  const sandMax = chapterMax(2);
  const sand = Math.min(build[2], sandMax);
  let rem = sand;
  const tileFilled = Math.min(rem, SAND_TILES);
  rem = Math.max(0, rem - SAND_TILES);
  const cactusFilled = Math.min(rem, 4);
  rem = Math.max(0, rem - 4);
  const wellFilled = Math.min(rem, 4);
  rem = Math.max(0, rem - 4);
  const palmFilled = Math.min(rem, 2);
  rem = Math.max(0, rem - 2);
  const decoFilled = Math.min(rem, BEACH_DECO_COUNT);
  toggleOn(document.getElementById("sandTiles").querySelectorAll(".sand-tile"), tileFilled);
  const cactusIds = ["cactusL1","cactusL2","cactusR2","cactusR1"];
  for(let ci=0;ci<4;ci++){
    const el = document.getElementById(cactusIds[ci]);
    if(el) el.classList.toggle("on", ci < cactusFilled);
  }
  document.getElementById("wellBase").classList.toggle("on", wellFilled >= 1);
  document.getElementById("wellRoof").classList.toggle("on", wellFilled >= 2);
  document.getElementById("wellPole").classList.toggle("on", wellFilled >= 3);
  document.getElementById("wellBucket").classList.toggle("on", wellFilled >= 4);
  document.getElementById("palmLeft").classList.toggle("on", palmFilled >= 1);
  document.getElementById("palmRight").classList.toggle("on", palmFilled >= 2);
  toggleOn(document.getElementById("beachDeco").querySelectorAll(".deco-item"), decoFilled);

  // 第4关：铁栅栏——一字一栅
  const ironMax = chapterMax(3);
  toggleOn(document.getElementById("ironBars").querySelectorAll(".iron-bar"), Math.min(build[3], ironMax));

  // 第5关：绿宝石——一字一宝石
  const emeraldMax = chapterMax(4);
  toggleOn(document.getElementById("emeraldGems").querySelectorAll(".emerald-gem"), Math.min(build[4], emeraldMax));

  // 第6关：红石灯——一字一盏
  const redstoneMax = chapterMax(5);
  toggleOn(document.getElementById("redstoneLamps").querySelectorAll(".redstone-lamp"), Math.min(build[5], redstoneMax));

  // 第7关：钻石块——一字一块
  const diamondMax = chapterMax(6);
  toggleOn(document.getElementById("diamondBlocks").querySelectorAll(".diamond-block"), Math.min(build[6], diamondMax));

  // 第8关：黑曜石盾

// 四条行进路线 × 6 个站位（0=最远，5=贴房即停）；站位索引 = 路线*6 + 步数
// 路线 0/2 面朝右，路线 1/3 面朝左（僵尸始终面向房子）
const ZOMBIE_SLOTS = [
  // 路线0 左前方：左下角 → 房前大门
  [{left:14,bottom:2},{left:40,bottom:8},{left:64,bottom:14},{left:88,bottom:20},{left:110,bottom:27},{left:128,bottom:35}],
  // 路线1 右前方：右下角 → 房前大门（面朝左）
  [{right:14,bottom:2},{right:40,bottom:8},{right:64,bottom:14},{right:88,bottom:20},{right:110,bottom:27},{right:128,bottom:35}],
  // 路线2 左墙根：左下角 → 左墙上半部
  [{left:4,bottom:2},{left:4,bottom:22},{left:5,bottom:42},{left:5,bottom:62},{left:6,bottom:82},{left:7,bottom:100}],
  // 路线3 右墙根：右下角 → 右墙上半部（面朝左）
  [{right:4,bottom:2},{right:4,bottom:22},{right:5,bottom:42},{right:5,bottom:62},{right:6,bottom:82},{right:7,bottom:100}]
];
const ZOMBIE_MAX = 24;

// 每答错一次：70% 前进（随机一只往前挪一格）/ 30% 增援（最外围多来一只）
// 前进无可挪（都贴到房前）时改为增援
function zombieAction(){
  const occupied = {};
  for(let i=0;i<zombieSlots.length;i++) occupied[zombieSlots[i]] = true;
  const doReinforce = function(){
    // 优先从四条路线最外围进场；外围都被占则找最远的空位
    const starts = [0,6,12,18].filter(function(s){ return !occupied[s]; });
    let slot;
    if(starts.length){
      slot = starts[Math.floor(Math.random()*starts.length)];
    }else{
      const free = [];
      for(let s=0;s<ZOMBIE_MAX;s++) if(!occupied[s]) free.push(s);
      if(!free.length) return false;
      free.sort(function(a,b){ return (a%6) - (b%6); });
      slot = free[0];
    }
    zombieSlots.push(slot);
    return true;
  };
  const doAdvance = function(){
    const movable = [];
    for(let i=0;i<zombieSlots.length;i++){
      const s = zombieSlots[i];
      if((s%6) < 5 && !occupied[s+1]) movable.push(i);
    }
    if(!movable.length) return false;
    const pick = movable[Math.floor(Math.random()*movable.length)];
    zombieSlots[pick] += 1;
    return true;
  };
  if(Math.random() < 0.7){
    if(!doAdvance()) doReinforce();
  }else{
    doReinforce();
  }
}

// 每答对一个字：离房子最近的一只僵尸后退一步；没法退（已在外围或身后一格被占）就地被干掉
function zombieRetreat(){
  if(zombieSlots.length === 0) return null;
  let best = 0;
  for(let i=1;i<zombieSlots.length;i++){
    if((zombieSlots[i]%6) > (zombieSlots[best]%6)) best = i;
  }
  const slot = zombieSlots[best];
  const occupied = {};
  for(let i=0;i<zombieSlots.length;i++) occupied[zombieSlots[i]] = true;
  if((slot%6) > 0 && !occupied[slot-1]){
    zombieSlots[best] -= 1;
    return "retreat";
  }
  // 没法退：原地倒下消失（克隆一个尸体节点播放倒下动画，本体从队列移除）
  const container = document.getElementById("vzombieContainer");
  if(container && container.children[best]){
    const dead = container.children[best];
    const ghost = dead.cloneNode(true);
    ghost.style.cssText = dead.style.cssText;
    ghost.style.zIndex = 20;
    ghost.style.animation = "vz-die .45s ease-in forwards";
    container.parentNode.appendChild(ghost);
    setTimeout(function(){ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 500);
    dead.parentNode.removeChild(dead);
  }
  zombieSlots.splice(best,1);
  return "kill";
}

function renderVillageZombies(){
  const container = document.getElementById("vzombieContainer");
  if(!container) return;
  const count = Math.min(zombieSlots.length, ZOMBIE_MAX);
  // 复用已有节点：僵尸挪动时能平滑过渡，且只有新增的那只弹入
  while(container.children.length > count){
    container.removeChild(container.lastChild);
  }
  for(let i=container.children.length;i<count;i++){
    const el = document.createElement("div");
    el.className = "vzombie show";
    el.innerHTML = '<div class="vz-body">' + ZOMBIE_SVG + '</div>';
    container.appendChild(el);
  }
  const grew = count > lastVzCount;
  lastVzCount = count;
  for(let i=0;i<count;i++){
    const el = container.children[i];
    const slot = zombieSlots[i];
    const lane = Math.floor(slot/6);
    const p = ZOMBIE_SLOTS[lane][slot%6];
    if(p.left != null){ el.style.left = p.left + "px"; el.style.right = "auto"; }
    else{ el.style.right = p.right + "px"; el.style.left = "auto"; }
    el.style.bottom = p.bottom + "px";
    el.style.zIndex = slot % 6;
    el.style.width = Math.round(20 + (slot%6)*1.8) + "px";  // 越靠近房子越大
    // 路线 1/3 的僵尸面朝左（面向房子）；每只摇晃节奏错开
    el.firstChild.style.transform = (lane % 2 === 1) ? "scaleX(-1)" : "none";
    el.firstChild.firstChild.style.animationDelay = (-(i*0.17)) + "s";
    el.style.animation = (grew && i === count - 1) ? "vz-pop-in .3s ease-out" : "none";
  }
}

function createParticles(){
  const count = 14;
  const skinClass = "particle-" + currentSkin();
  for(let i=0;i<count;i++){
    const p = document.createElement("div");
    p.className = "particle " + skinClass;
    dom.particleBox.appendChild(p);
    const startX = 50 + Math.random()*80;
    const startY = 50 + Math.random()*80;
    const vx = (Math.random()-0.5)*8;
    const vy = -(Math.random()*5 + 2);
    p.style.left = startX+"px";
    p.style.top = startY+"px";
    let t = 0;
    const gravity = 0.3;
    let curVy = vy;
    const step = ()=>{
      t++;
      curVy += gravity;
      p.style.left = (parseFloat(p.style.left)+vx)+"px";
      p.style.top = (parseFloat(p.style.top)+curVy)+"px";
      p.style.opacity = 1 - t/32;
      if(t < 32){
        requestAnimationFrame(step);
      }else{
        p.remove();
      }
    };
    requestAnimationFrame(step);
  }
}

function playZombieGroan(){
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(110, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.35);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime + 0.4);
}
function playHitSound(){

  osc.type = "square";

  osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime + 0.15);
}
function lastRunSummary(){
  const names = ["小屋","石墙","庭院","铁栏","宝塔","机关","城墙","堡垒"];
  var done = [];
  var mid = [];
  for(var i=0;i<8;i++){
    var max = chapterMax(i);
    if(build[i] >= max) done.push(names[i]);
    else if(build[i] > 0) mid.push(names[i] + " " + build[i] + "/" + max);
  }
  var s = "上轮：";
  if(done.length) s += done.join("、") + "都齐了";
  if(mid.length) s += (done.length ? "；" : "") + mid.join("、") + "还在建";
  if(!done.length && !mid.length) s += "还没开工";
  s += "。\n再来一次会新开一座空村，绿宝石从 0 再攒。";
  return s;
}

  zombieStep = 0;

function startReview(pendingUp){
  if(pendingUp) pendingLevelUp = true;
  if(missed.length === 0){
    zombieStep = 0;
    inReview = false;
    if(pendingLevelUp){
      pendingLevelUp = false;
      goToNextLevelOrWin();
    }else{
      refreshUI();
    }
    return;
  }
  inReview = true;
  reviewList = missed.slice();
  reviewIndex = 0;
  resumeIndex = index;
  zombieStep = 3;
  pinyinRevealed = false;
  clearAutoNext();
  setAnswerLocked(false);
  refreshUI();
  dom.tipText.innerText = pendingLevelUp
    ? "📖 过关前先把错题再读一遍！"
    : "👹 僵尸围过来了！快读对，或者建炮塔！";
  dom.zombieText.innerText = "👹 僵尸就在面前！";
  saveState();
}

function goToNextLevelOrWin(){
  pinyinRevealed = false;
  if(currentLevel < levels.length - 1){
    currentLevel += 1;
    index = 0;
    inReview = false;
    saveState();
    setStage();
    if(skipEnterModal){
      skipEnterModal = false;
      dom.tipText.innerText = "🎉 太棒了！进入" + levels[currentLevel].name + "！";
      return;
    }
    const info = LEVEL_ENTER[currentLevel];
    showNote(info.title, info.text);
    return;
  }
  setAnswerLocked(true);
  dom.winTitle.innerText = "🏆 冒险完成！";
  dom.winText.innerText = "你一共收集了 " + gem + " 颗绿宝石！\n你是一位超级识字冒险家！\n" + lastRunSummary();
  dom.winModal.classList.add("show");

}

function finishReview(){
  inReview = false;
  const pending = pendingLevelUp;
  pendingLevelUp = false;
  reviewList = [];
  reviewIndex = 0;
  pinyinRevealed = false;
  zombieStep = 0;
  zombieSlots = [];
  dom.zombieText.innerText = "";
  dom.tipText.innerText = "宝贝大声读出方块上的汉字吧！";
  if(pending){
    goToNextLevelOrWin();
    return;
  }
  index = resumeIndex;
  if(index >= wordList.length){
    if(missed.length > 0){
      startReview(true);
      return;
    }
    goToNextLevelOrWin();
    return;
  }
  if(missed.indexOf(wordList[index]) < 0){
    index += 1;
    if(index >= wordList.length){
      if(missed.length > 0){
        startReview(true);
        return;
      }
      goToNextLevelOrWin();
      return;
    }
  }
  saveState();
  refreshUI();
  dom.tipText.innerText = "继续冒险吧！读出方块上的汉字！";
  dom.zombieText.innerText = "";
}

  gem += 1;

  const levelUp = willLevelUpAfterThis();
  // 击退反馈：最近的一只僵尸后退一步，退不了就被干掉

  createParticles();
  playDigSound();
  setTimeout(()=>playGemSound(),120);
  speakCurrent();
  saveState();

  autoNextTimer = setTimeout(function(){
    autoNextTimer = null;

      const msg = combinedClearText();
      skipEnterModal = true;
      showNote(msg.title, msg.text, function(){ nextWord(); });
    }else if(justFinished){
      showNote(CHAPTERS[currentLevel].done, "读对的字都变成了村庄里的一块砖，继续加油！", function(){ nextWord(); });
    }else if(levelUp && currentLevel < levels.length - 1){

      const next = currentLevel + 1;
      showNote("🎉 进入" + levels[next].name, "还有没盖完的部分，下一关可以继续扩建。", function(){ nextWord(); });

    saveState();
    refreshUI();
    return;
  }
  index += 1;
  if(index >= wordList.length){
    if(missed.length > 0){
      startReview(true);
      return;
    }
    goToNextLevelOrWin();
    return;
  }
  dom.tipText.innerText = "宝贝大声读出方块上的汉字吧！";
  dom.zombieText.innerText = "";
  saveState();
  refreshUI();
}

function restartGame(){
  clearAutoNext();
  dom.winModal.classList.remove("show");
  if(dom.noteModal) dom.noteModal.classList.remove("show");
  noteAfter = null;
  skipEnterModal = false;
  currentLevel = 0;
  index = 0;
  gem = 0;
  zombieStep = 0;
  zombieWave = 0;
  turretCount = 0;
  missed = [];
  inReview = false;
  reviewList = [];
  reviewIndex = 0;
  pendingLevelUp = false;
  pinyinRevealed = false;
  build = [0,0,0,0,0,0,0,0];
  saveState();
  setStage();
  dom.tipText.innerText = "新一轮冒险开始，加油冒险者！";
}

function resetAll(){
  if(confirm("确定要重置全部进度吗？绿宝石和村庄建造都会清零哦！")){
    clearAutoNext();
    gem = 0;
    currentLevel = 0;
    index = 0;
    zombieStep = 0;
    zombieWave = 0;
    turretCount = 0;
    missed = [];
    inReview = false;
    reviewList = [];
    reviewIndex = 0;
    pendingLevelUp = false;
    pinyinRevealed = false;
    build = [0,0,0,0,0,0,0,0];
    noteAfter = null;
    skipEnterModal = false;
    if(dom.noteModal) dom.noteModal.classList.remove("show");
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    setStage();
    dom.tipText.innerText = "进度已重置，新的冒险开始！";
  }
}

initVillage();
loadState();
wordList = levels[currentLevel].words;
if(index >= wordList.length) index = 0;
setStage();
</script>
